<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KoroneProxy</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="card">
    <header class="brand">
      <span class="mark">&gt;_</span>
      <h1>KoroneProxy</h1>
    </header>

    <label class="field" for="url">
      <span>paste a <b>pekora.zip</b> api url</span>
      <input id="url" type="url" placeholder="https://www.pekora.zip/apisite/..." autofocus autocomplete="off" spellcheck="false" />
    </label>

    <div id="out" class="result" hidden>
      <code id="proxied"></code>
      <button id="copy" type="button" class="btn">Copy</button>
    </div>
    <p id="err" class="error" hidden></p>

    <footer class="hint">
      <span>rewrites to this host</span>
      <code>/apisite/*</code>
    </footer>
  </main>

  <script>
    const ALLOWED = new Set(["pekora.zip", "www.pekora.zip"]);
    const input = document.getElementById("url");
    const out = document.getElementById("out");
    const proxied = document.getElementById("proxied");
    const err = document.getElementById("err");
    const copyBtn = document.getElementById("copy");

    function convert(raw) {
      const v = raw.trim();
      if (!v) return { url: "", error: "" };
      let u;
      try { u = new URL(v); } catch {
        return { url: "", error: "invalid url" };
      }
      if (u.protocol !== "https:") return { url: "", error: "https only" };
      if (!ALLOWED.has(u.hostname)) return { url: "", error: "pekora.zip only" };
      return { url: location.origin + u.pathname + u.search, error: "" };
    }

    input.addEventListener("input", () => {
      const { url, error } = convert(input.value);
      if (url) {
        proxied.textContent = url;
        out.hidden = false;
      } else {
        out.hidden = true;
      }
      err.textContent = error;
      err.hidden = !error;
    });

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(proxied.textContent);
        copyBtn.textContent = "Copied";
        setTimeout(() => (copyBtn.textContent = "Copy"), 1000);
      } catch {}
    });
  </script>
</body>
</html>
